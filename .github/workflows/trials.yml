# Runs the Claude half of TB3's /run (3 trials) and /cheat (1 trial) on GitHub
# Actions runners, one trial per runner, with the CI-pinned Harbor version and
# the agent config from ci/harbor-run-defaults.yml. Auth is a Claude
# subscription OAuth token stored as the repo secret CLAUDE_CODE_OAUTH_TOKEN.
# Raw Harbor output is committed to results/actions/.
name: TB3 trials

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    name: ${{ matrix.kind }} ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: run, n: 1 }
          - { kind: run, n: 2 }
          - { kind: run, n: 3 }
          - { kind: cheat, n: 1 }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install Harbor (CI-pinned version)
        run: uv tool install "harbor==$(cat ci/harbor-version)"

      - name: Oracle sanity check
        if: matrix.kind == 'run' && matrix.n == 1
        continue-on-error: true
        run: harbor run -p staging-smoke-access --agent oracle --env docker --yes -o "$PWD/results/actions/oracle"

      - name: Agent trial
        continue-on-error: true  # harbor exits non-zero when the reward is 0
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          EXTRA=()
          if [ "${{ matrix.kind }}" = cheat ]; then
            EXTRA=(--extra-instruction-path ci/hack-trial-prompt.md)
          fi
          harbor run -p staging-smoke-access --env docker --yes \
            -o "$PWD/results/actions/${{ matrix.kind }}-${{ matrix.n }}" -k 1 -n 1 \
            --agent claude-code --model anthropic/claude-fable-5-1 --ak reasoning_effort=max \
            --ae CLAUDE_CODE_MAX_OUTPUT_TOKENS=128000 \
            --ae CLAUDE_FORCE_OAUTH=1 --ae CLAUDE_CODE_OAUTH_TOKEN="$TOKEN" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Redact token from output files
        if: always()
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, pathlib
          tok = os.environ["TOKEN"].strip()
          for p in pathlib.Path("results").rglob("*"):
              if p.is_file():
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  if tok and tok in s:
                      p.write_text(s.replace(tok, "<redacted>"))
          EOF

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ${{ matrix.kind }}-${{ matrix.n }}
          path: results/actions
          include-hidden-files: true

  commit:
    needs: trial
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          path: results/actions
          merge-multiple: true

      - name: Summarize and commit results
        run: |
          python3 - <<'EOF' | tee results/actions/summary.txt
          import glob, json, os
          for d in sorted(glob.glob("results/actions/*/*/staging-smoke-access__*")):
              try:
                  r = json.load(open(os.path.join(d, "result.json")))
              except (OSError, ValueError):
                  r = {}
              vr, ex = r.get("verifier_result"), r.get("exception_info")
              out = ("reward %s" % vr["rewards"].get("reward")) if vr else ("ERROR %s" % (ex.get("exception_type") if isinstance(ex, dict) else ex))
              print(f"{d.split('/')[2]:10} {os.path.basename(d):38} {out}")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/actions
          git commit -m "Add GitHub Actions trial results (/run x3, /cheat x1, Claude)"
          git pull --rebase origin main
          git push
